<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Formula Simulation — Garage</title>
  <meta name="description" content="Garaje interactivo con ajustes del monoplaza y estrategia de paradas, repostaje y desgaste de neumáticos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Cuatro colores base; los matices se generan sin añadir otros tonos. */
      --yellow:#E3B23C; /* Amarillo industrial */
      --gray:#171B1F; /* Gris grafito, fondo dark */
      --steel:#607E91; /* Azul acero */
      --smoke:#E9ECE8; /* Blanco humo */
      --bg:var(--gray); --deep:var(--gray);
      --navy:color-mix(in srgb, var(--gray) 85%, var(--steel));
      --navy2:color-mix(in srgb, var(--gray) 65%, var(--steel));
      --orange:var(--yellow); --orange2:var(--yellow);
      --cyan:var(--yellow); --cyan2:var(--steel);
      --white:var(--smoke); --muted:color-mix(in srgb, var(--smoke) 52%,var(--steel));
      --line:color-mix(in srgb, var(--gray) 54%,var(--steel)); --control:var(--steel);
      --font:'Rajdhani','Arial Narrow','Segoe UI',sans-serif;
      --display:'Chakra Petch','Arial Narrow',sans-serif;
      color-scheme:dark;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-width:320px; color:var(--white); background:
      radial-gradient(ellipse at 49% 12%,color-mix(in srgb, color-mix(in srgb, var(--gray) 45%, var(--steel)) 26%, transparent),transparent 55%),
      radial-gradient(ellipse at 2% 85%,color-mix(in srgb, color-mix(in srgb, var(--gray) 82%, var(--steel)) 36%, transparent),transparent 58%),
      var(--gray); font-family:var(--font); font-size:16px; }
    body::before { content:""; pointer-events:none; position:fixed; inset:0; opacity:.21;
      background: repeating-linear-gradient(0deg,transparent 0px,transparent 5px,color-mix(in srgb, color-mix(in srgb, var(--steel) 35%, var(--smoke)) 6.5%, transparent) 6px),
      repeating-linear-gradient(104deg,transparent 0px,transparent 190px,color-mix(in srgb, color-mix(in srgb, var(--steel) 78%, var(--smoke)) 14%, transparent) 192px,transparent 194px); z-index:-1; }
    button, input, select {font:inherit;}
    button {cursor:pointer;}
    button:focus-visible, input:focus-visible, select:focus-visible {outline:2px solid var(--cyan);outline-offset:3px;}
    .app {max-width:1610px;margin:0 auto;padding:20px 23px 14px;}
    .header {display:flex;align-items:center;gap:22px;min-height:94px;position:relative;overflow:hidden;
      padding:14px 26px 14px 110px;border-bottom:2px solid var(--yellow);
      background:linear-gradient(105deg,color-mix(in srgb, var(--yellow) 94%, transparent),color-mix(in srgb, var(--yellow) 88%, transparent) 40%,color-mix(in srgb, color-mix(in srgb, var(--gray) 82%, var(--steel)) 18%, transparent) 74%,transparent 100%);}
    .header:before {content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(-13deg,transparent 0,transparent 7px,color-mix(in srgb, var(--smoke) 3.2%, transparent) 8px,transparent 11px);}
    .helmet {position:absolute;left:24px;top:9px;width:75px;height:75px;filter:drop-shadow(0 8px 3px color-mix(in srgb, var(--gray) 50%, transparent));transform:rotate(-12deg);}
    .title-wrap {display:flex;align-items:baseline;flex-wrap:wrap;gap:20px;position:relative;}
    .brand {font-family:var(--display);font-size:clamp(28px,3.1vw,49px);font-weight:700;letter-spacing:-2px;font-style:italic;text-transform:uppercase;text-shadow:1px 2px 0 color-mix(in srgb, var(--gray) 40%, transparent);line-height:1;}
    .header-sub {font-family:var(--display);font-size:clamp(13px,1.3vw,21px);font-weight:600;font-style:italic;letter-spacing:.8px;}
    .event {margin-left:auto;position:relative;text-align:right;color:color-mix(in srgb, var(--steel) 17%, var(--smoke));text-transform:uppercase;letter-spacing:1px;font-size:13px;line-height:1.13;white-space:nowrap;}
    .event strong {display:block;color:var(--smoke);font-size:20px;font-weight:700;letter-spacing:1.6px;}
    .nav {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:14px 0 13px;}
    .tab {min-width:0;min-height:64px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:8px 8px 2px 2px;
      border:1px solid color-mix(in srgb, var(--gray) 45%, var(--steel));border-bottom:3px solid color-mix(in srgb, var(--gray) 45%, var(--steel));color:color-mix(in srgb, var(--steel) 35%, var(--smoke));background:linear-gradient(145deg,color-mix(in srgb, var(--gray) 82%, var(--steel)),var(--gray) 75%);
      text-transform:uppercase;font:700 16px var(--font);letter-spacing:1px;transform:skew(-6deg);transition:background .2s,color .2s,box-shadow .2s;}
    .tab>* {transform:skew(6deg);} .tab svg{width:26px;height:26px;stroke:var(--yellow);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .tab.active {border-color:color-mix(in srgb, var(--steel) 55%, var(--smoke));border-bottom-color:var(--cyan);color:var(--smoke);background:linear-gradient(160deg,color-mix(in srgb, var(--gray) 45%, var(--steel)),color-mix(in srgb, var(--gray) 82%, var(--steel)) 73%);box-shadow:inset 0 0 21px color-mix(in srgb, color-mix(in srgb, var(--steel) 78%, var(--smoke)) 26%, transparent),0 0 13px color-mix(in srgb, color-mix(in srgb, var(--steel) 55%, var(--smoke)) 13%, transparent);}
    .tab.active svg {stroke:var(--smoke);filter:drop-shadow(0 0 6px color-mix(in srgb, var(--steel) 55%, var(--smoke)));}
    .utility {display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:13px;min-height:36px;padding:5px 12px;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));border-left:3px solid var(--orange);
      background:linear-gradient(90deg,color-mix(in srgb, color-mix(in srgb, var(--gray) 82%, var(--steel)) 65%, transparent),transparent);}
    .utility .identifier {font:600 12px var(--display);letter-spacing:1.6px;color:var(--orange);}
    .switchline {display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:600;font-size:15px;}
    .switchline input {accent-color:var(--orange);width:18px;height:18px;margin:0;cursor:pointer;}
    .utility .separator {width:1px;height:19px;background:color-mix(in srgb, var(--gray) 45%, var(--steel));}
    .utility .hint {margin-left:auto;font-size:13px;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));}
    .workspace {display:grid;grid-template-columns:minmax(315px,1fr) minmax(260px,320px) minmax(315px,1fr);
      grid-template-rows:1fr 1fr;grid-template-areas:'lf car rf' 'lr car rr';gap:13px;min-height:644px;align-items:stretch;}
    .area-lf{grid-area:lf}.area-rf{grid-area:rf}.area-lr{grid-area:lr}.area-rr{grid-area:rr}
    .panel {min-width:0; padding:13px 15px 12px;border:1px solid var(--steel);border-radius:10px 10px 10px 10px;
      background:linear-gradient(160deg,color-mix(in srgb, color-mix(in srgb, var(--gray) 91%, var(--steel)) 95%, transparent),color-mix(in srgb, var(--gray) 93%, transparent) 82%);
      box-shadow:inset 0 1px color-mix(in srgb, color-mix(in srgb, var(--steel) 17%, var(--smoke)) 7%, transparent),0 5px 28px color-mix(in srgb, var(--gray) 18%, transparent);}
    .panel-head {display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--steel);}
    .panel-title {color:var(--cyan);font:700 clamp(16px,1.4vw,20px) var(--display);font-style:italic;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;}
    .panel-tag {font:600 12px var(--font);white-space:nowrap;color:color-mix(in srgb, var(--steel) 55%, var(--smoke));letter-spacing:.4px;}
    .panel-tag b {font-weight:700;color:var(--yellow);font-size:15px;margin-left:3px;}
    .panel-description {color:color-mix(in srgb, var(--steel) 55%, var(--smoke));font-size:13px;margin:1px 0 10px;line-height:1.2;}
    .parameter {display:grid;grid-template-columns:minmax(95px,1.15fr) 21px minmax(70px,1.25fr) minmax(61px,.6fr) 21px 17px;gap:6px;align-items:center;min-height:31px;padding:2px 0;}
    .parameter+.parameter {border-top:1px solid color-mix(in srgb, color-mix(in srgb, var(--gray) 45%, var(--steel)) 25%, transparent);}
    .param-name {font-size:14px;line-height:1.04;color:color-mix(in srgb, var(--steel) 17%, var(--smoke));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .adjust {display:grid;place-items:center;height:21px;width:21px;padding:0;color:var(--smoke);background:linear-gradient(var(--steel),color-mix(in srgb, var(--gray) 82%, var(--steel)));border:1px solid color-mix(in srgb, var(--steel) 78%, var(--smoke));border-radius:3px;line-height:1;font:700 19px var(--font);}
    .adjust:active{transform:translateY(1px);}
    .range {--pct:45%;width:100%;min-width:0;appearance:none;-webkit-appearance:none;height:10px;border:1px solid color-mix(in srgb, var(--steel) 78%, var(--smoke));border-radius:50px;cursor:pointer;
      background:linear-gradient(90deg,var(--yellow) 0%,var(--yellow) var(--pct),var(--steel) var(--pct),color-mix(in srgb, var(--gray) 82%, var(--steel)) 100%);
      box-shadow:inset 0 2px 3px color-mix(in srgb, var(--gray) 56%, transparent),0 0 6px color-mix(in srgb, color-mix(in srgb, var(--steel) 78%, var(--smoke)) 17%, transparent);}
    .range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;height:22px;width:11px;border-radius:2px;border:1px solid color-mix(in srgb, var(--steel) 17%, var(--smoke));background:linear-gradient(90deg,color-mix(in srgb, var(--steel) 55%, var(--smoke)),var(--smoke) 40%,color-mix(in srgb, var(--steel) 17%, var(--smoke)));box-shadow:1px 1px 4px color-mix(in srgb, var(--gray) 91%, var(--steel));}
    .range::-moz-range-thumb{height:20px;width:10px;border-radius:2px;border:1px solid color-mix(in srgb, var(--steel) 17%, var(--smoke));background:linear-gradient(90deg,color-mix(in srgb, var(--steel) 55%, var(--smoke)),var(--smoke) 40%,color-mix(in srgb, var(--steel) 17%, var(--smoke)));}
    .param-value {white-space:nowrap;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));text-align:right;font:700 14px var(--font);font-variant-numeric:tabular-nums;}
    .info {width:17px;height:17px;line-height:15px;border:1px solid var(--steel);border-radius:50%;padding:0;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));background:transparent;font:700 12px var(--font);}
    .info:hover,.info:focus-visible{border-color:var(--cyan);color:var(--smoke);}
    .panel-note {color:color-mix(in srgb, var(--steel) 55%, var(--smoke));font-size:13px;line-height:1.25;margin-top:9px;padding:8px 9px;background:color-mix(in srgb, var(--gray) 91%, var(--steel));border-left:2px solid color-mix(in srgb, var(--steel) 78%, var(--smoke));}
    .status {display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:9px 0 0;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));font-size:13px;}
    .status b{color:var(--smoke);font-weight:700;}
    .pill{font-size:11px;padding:2px 6px;border:1px solid color-mix(in srgb, var(--gray) 45%, var(--steel));border-radius:3px;background:color-mix(in srgb, var(--gray) 82%, var(--steel));color:color-mix(in srgb, var(--steel) 35%, var(--smoke));letter-spacing:.5px;text-transform:uppercase;}
    .center {grid-area:car;min-width:0;position:relative;border-radius:10px;background:radial-gradient(ellipse at 50% 44%,color-mix(in srgb, var(--gray) 82%, var(--steel)) 0%,color-mix(in srgb, color-mix(in srgb, var(--gray) 91%, var(--steel)) 66%, transparent) 39%,color-mix(in srgb, var(--gray) 36%, transparent) 73%);
      display:flex;flex-direction:column;align-items:stretch;padding:6px 3px 10px;gap:5px;}
    .center:before,.center:after{content:"";position:absolute;top:15%;bottom:18%;width:1px;background:linear-gradient(transparent,color-mix(in srgb, color-mix(in srgb, var(--steel) 78%, var(--smoke)) 30%, transparent),transparent);}
    .center:before{left:9%}.center:after{right:9%}
    .center-top {display:flex;align-items:center;justify-content:center;gap:7px;color:var(--cyan);font:700 12px var(--display);letter-spacing:2px;z-index:1;}
    .center-top .dash {flex:1;max-width:36px;height:1px;background:var(--steel);}
    .car-wrap{position:relative;flex:1;display:flex;justify-content:center;align-items:center;min-height:365px;}
    .car-wrap::before{content:"";position:absolute;left:50%;top:1%;height:97%;border-left:1px dashed color-mix(in srgb, color-mix(in srgb, var(--steel) 55%, var(--smoke)) 22%, transparent);}
    .car-svg {width:min(100%,280px);height:100%;max-height:525px;min-height:350px;filter:drop-shadow(0 13px 12px color-mix(in srgb, var(--gray) 75%, transparent));z-index:1;}
    .center-adjust {position:relative;z-index:2;border:1px solid var(--steel);border-radius:6px;padding:9px 10px;margin:1px 4px 0;background:color-mix(in srgb, color-mix(in srgb, var(--gray) 91%, var(--steel)) 92%, transparent);}
    .center-adjust .parameter {grid-template-columns:minmax(65px,1fr) 20px minmax(70px,1.1fr) minmax(65px,.65fr) 20px 17px;}
    .center-adjust .center-label {font:700 12px var(--display);color:var(--cyan);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
    .middle-message {font-size:12px;line-height:1.2;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));text-align:center;margin-top:3px;}
    .compound {display:flex;gap:4px;flex-wrap:wrap;}
    .compound button {flex:1;padding:7px 3px;min-width:53px;background:color-mix(in srgb, var(--gray) 82%, var(--steel));border:1px solid var(--steel);color:color-mix(in srgb, var(--steel) 35%, var(--smoke));border-radius:4px;font:700 13px var(--font);}
    .compound button.selected {background:linear-gradient(var(--yellow),var(--yellow));border-color:var(--yellow);color:var(--smoke);}
    .global-footer {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px;padding:13px 16px;
      border-top:2px solid var(--steel);background:linear-gradient(100deg,color-mix(in srgb, var(--gray) 80%, transparent),color-mix(in srgb, var(--yellow) 78%, transparent) 76%,color-mix(in srgb, color-mix(in srgb, var(--gray) 82%, var(--steel)) 95%, transparent));}
    .footleft,.footright{display:flex;align-items:center;flex-wrap:wrap;gap:9px;}
    .action {padding:7px 12px;border-radius:5px;background:color-mix(in srgb, var(--gray) 82%, var(--steel));border:1px solid var(--steel);color:color-mix(in srgb, var(--steel) 17%, var(--smoke));font-weight:700;letter-spacing:.5px;}
    .action:hover{border-color:color-mix(in srgb, var(--steel) 35%, var(--smoke));color:var(--smoke);}
    .action.primary{background:linear-gradient(var(--yellow),var(--yellow));border-color:var(--yellow);color:var(--smoke);}
    .kbd {display:inline-grid;place-items:center;margin-right:5px;width:22px;height:22px;border-radius:50%;font:700 14px var(--font);background:linear-gradient(125deg,color-mix(in srgb, var(--steel) 78%, var(--smoke)),color-mix(in srgb, var(--gray) 45%, var(--steel)));color:var(--smoke);}
    .action.primary .kbd {background:linear-gradient(var(--yellow),var(--yellow));}
    .saved {min-width:140px;font-size:13px;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));}
    .learn {display:grid;grid-template-columns:1.2fr 1fr;gap:0;margin-top:13px;border:1px solid color-mix(in srgb, var(--gray) 45%, var(--steel));border-radius:8px;overflow:hidden;background:color-mix(in srgb, color-mix(in srgb, var(--gray) 91%, var(--steel)) 85%, transparent);}
    .learn section {padding:14px 19px;}
    .learn section+section{border-left:1px solid color-mix(in srgb, var(--gray) 45%, var(--steel));}
    .learn small {display:block;color:var(--orange);letter-spacing:2px;font:700 11px var(--display);margin-bottom:5px;text-transform:uppercase;}
    .learn h2 {font:700 19px var(--display);margin:0 0 6px;color:var(--smoke);}
    .learn p {margin:0;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));font-size:15px;line-height:1.35;}
    .fine-print{font-size:12px;line-height:1.3;color:color-mix(in srgb, var(--steel) 78%, var(--smoke));margin:11px 5px;}
    .toast {position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);padding:10px 18px;border:1px solid var(--cyan);border-radius:5px;background:color-mix(in srgb, var(--gray) 82%, var(--steel));z-index:50;box-shadow:0 12px 25px color-mix(in srgb, var(--gray) 60%, transparent);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
    .toast.show {opacity:1;transform:translateX(-50%) translateY(0);}
    .hidden{display:none!important;}
    @media (max-width:1220px){
      .app{padding:10px 12px;}
      .workspace{grid-template-columns:minmax(270px,1fr) minmax(230px,270px) minmax(270px,1fr);gap:9px;}
      .panel{padding:11px 9px;}
      .parameter{grid-template-columns:minmax(82px,1fr) 19px minmax(55px,1.05fr) minmax(55px,.65fr) 19px 15px;gap:4px;}
      .adjust{height:19px;width:19px;}
      .param-name{font-size:12.5px;}.param-value{font-size:12px;}.info{width:15px;height:15px;line-height:13px;}
    }
    @media (max-width:925px){
      .workspace{grid-template-columns:1fr 1fr;grid-template-rows:auto;grid-template-areas:'car car' 'lf rf' 'lr rr';min-height:0;}
      .center{max-width:100%;display:grid;grid-template-columns:1fr 240px;grid-template-rows:25px 1fr;gap:0;padding:8px 12px;}
      .center-top {grid-column:1 / 3;grid-row:1;}
      .car-wrap{grid-row:2;grid-column:1;min-height:315px;}
      .car-svg{min-height:300px;max-height:360px;}
      .center-adjust{grid-row:2;grid-column:2;align-self:center;}
      .center .middle-message{grid-row:3;grid-column:1/3;}
      .parameter{grid-template-columns:minmax(95px,1.15fr) 21px minmax(80px,1fr) minmax(65px,.6fr) 21px 17px;}
      .param-name{font-size:14px;}.param-value{font-size:14px;}
      .learn{grid-template-columns:1fr;}.learn section+section{border-left:0;border-top:1px solid color-mix(in srgb, var(--gray) 45%, var(--steel));}
    }
    @media (max-width:630px){
      .header{padding:13px 12px 13px 72px;min-height:77px;}
      .helmet{width:54px;height:54px;top:11px;left:12px;}
      .brand{font-size:29px;letter-spacing:-1px;}.header-sub{font-size:13px;}.title-wrap{gap:3px 13px;}
      .event{display:none;}
      .nav{grid-template-columns:1fr 1fr;gap:5px;}
      .tab{min-height:51px;font-size:13px;gap:6px;}.tab svg{width:19px;height:19px;}
      .utility{font-size:12px;padding:7px;}.utility .hint{margin-left:0;}
      .workspace{grid-template-columns:1fr;grid-template-areas:'car' 'lf' 'rf' 'lr' 'rr';}
      .center{display:flex;flex-direction:column;padding:9px 7px;}
      .car-wrap{min-height:320px;max-height:365px;}
      .center-adjust{align-self:stretch;padding:9px 12px;}
      .center-adjust .parameter{grid-template-columns:minmax(75px,1fr) 20px minmax(85px,1fr) minmax(72px,.7fr) 20px 17px;gap:4px;}
      .center-adjust .param-name{font-size:13px;}.center-adjust .param-value{font-size:12px;}
      .car-svg{min-height:300px;}
      .panel{padding:11px 12px;}.panel-title{font-size:17px;}
      .global-footer{padding:10px;}.footleft,.footright{width:100%;justify-content:space-around;}
      .saved{width:100%;text-align:center;}
    }
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;}}
      /* V2: overview and context-sensitive illustration surfaces */
    .nav {grid-template-columns:repeat(5,minmax(0,1fr));}
    .tab.tab-home svg{stroke:color-mix(in srgb, var(--steel) 35%, var(--smoke));}
    .tab{font-size:14px;gap:9px;}
    .overview{min-height:690px;overflow:hidden;padding:22px 25px 19px;border:1px solid var(--steel);border-radius:10px;position:relative;
      background:radial-gradient(ellipse at 49% 58%,color-mix(in srgb, color-mix(in srgb, var(--gray) 68%, var(--steel)) 38%, transparent),transparent 54%),linear-gradient(150deg,color-mix(in srgb, var(--gray) 98%, transparent),color-mix(in srgb, var(--gray) 95%, transparent));}
    .overview:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 42px,color-mix(in srgb, color-mix(in srgb, var(--steel) 78%, var(--smoke)) 4.5%, transparent) 43px,transparent 44px);}
    .overview-head{display:flex;justify-content:space-between;align-items:center;gap:24px;position:relative;z-index:1;margin-bottom:12px;}
    .eyebrow{font:700 12px var(--display);letter-spacing:2.5px;color:var(--yellow);}
    .overview-head h1{font:italic 700 clamp(24px,3.3vw,44px) var(--display);letter-spacing:-.8px;line-height:1.15;margin:8px 0 6px;color:var(--smoke);}
    .headline-dot{color:var(--yellow);}

    .workspace.workspace-wide{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto;grid-template-areas:'car car car car' 'lf fr lr rr';min-height:0;align-items:stretch;}

    .workspace.workspace-wide .panel-title{font-size:17px;}

    /* Compact modern layout and pit strategy */
    .app{max-width:1510px;padding:16px 22px 18px;}
    .header{min-height:78px;padding:10px 24px 10px 94px;border-radius:8px 8px 2px 2px;}

    .center-adjust .center-label.with-gap{margin-top:18px;}
    .panel-head{margin-bottom:12px;}
    .parameter,.center-adjust .parameter{grid-template-columns:minmax(100px,1.25fr) 21px minmax(66px,1fr) minmax(58px,.7fr) 21px;gap:7px;min-height:35px;}
    .center-adjust .parameter{grid-template-columns:minmax(85px,1.5fr) 20px minmax(48px,1fr) minmax(52px,.7fr) 20px;gap:4px;}
    .param-name{font-size:14px;}.param-value{font-size:14px;}.adjust{width:21px;height:22px;}
    .center-adjust .param-name,.center-adjust .param-value{font-size:12.5px;}
    .panel-title{font-size:19px;}.panel-tag{font-size:11px;}
    .thin-divider{height:1px;background:color-mix(in srgb, var(--gray) 45%, var(--steel));margin:9px 0;}

    .engine-metrics strong{font:700 26px var(--display);color:var(--smoke);letter-spacing:1px;}
    .engine-metrics span{font-size:13px;color:color-mix(in srgb, var(--steel) 35%, var(--smoke));}
    .global-footer{margin-top:13px;border-radius:7px;gap:9px;background:linear-gradient(100deg,color-mix(in srgb, var(--gray) 91%, var(--steel)),color-mix(in srgb, var(--gray) 82%, var(--steel)));}
    .action{padding:12px 16px;min-height:44px;font-size:15px;}

    .saved{min-width:140px;text-align:right;}
    /* Pit board */

    .strategy-top{display:grid;grid-template-columns:1.3fr 1fr;gap:13px;}
    .strategy-config,.strategy-service{min-height:234px;}

    /* Open Formula: paleta industrial de cuatro colores; acabado dark mate. */

<body>
  <main class="app">

    <div class="utility" id="symmetry-row"><label class="switchline"><input type="checkbox" id="symmetry" checked /> Ajustes simétricos L/R</label></div>
    <div id="workspace" class="workspace" aria-live="off"></div>
    <section id="setups-workspace" class="hidden" aria-label="Reglajes">

      <div style="max-height:360px;overflow-y:auto;margin:16px 0">
        <table style="width:100%;text-align:left;border-spacing:0 8px">
          <thead><tr><th>Nombre del reglaje</th><th>Equipo</th><th>Última modificación</th></tr></thead>
          <tbody id="reglajes-list"></tbody>

      </div>
      <button class="action" id="create-reglaje">Crear nuevo reglaje</button>
      <button class="action primary" id="save">Guardar</button>
      <button class="action" id="load-reglaje">Cargar</button>
      <button class="action" id="delete-reglaje">Eliminar</button>
    </section>
    <footer class="global-footer">
      <div class="footleft">
        <button class="action" id="reset">↺ Restaurar pestaña</button>
      </div>
      <div class="footright">
        <span class="saved" id="save-state">Configuración guardada</span>
        <button class="action action-exit" id="exit">Salir de Garaje</button>
      </div>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    const svg=(contents)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${contents}</svg>`;
    const icon={
      suspension:svg('<path d="M9 2h6v3H9zM5 5h14M12 5v3M7 9l10 2-10 2 10 2-10 2 10 2M12 20v2"/>'),

      power:svg('<path d="M4 7h13l3 3v6H4zM7 7V4h5v3M2 10h2m-2 4h2m16-4h2m-2 4h2M7 19h10M8 10v3m4-3v3m4-3v3"/>'),
      pits:svg('<path d="M4 21V5l8-3 8 3v16M4 9h16M8 13v4m4-4v4m4-4v4M2 21h20"/>')

    const categories=[
      {id:'aeroWheels',label:'Aero y Ruedas',icon:'aero'},
      {id:'suspension',label:'Suspensión',icon:'suspension'},
      {id:'power',label:'Motor y Caja',icon:'power'},
      {id:'strategy',label:'Estrategia de Pits',icon:'pits'},

    const defaults={
      suspension:{
        FL:{packers:0,fastBump:3,fastRebound:6,slowBump:8,slowRebound:20,spring:1200,rideHeight:33},

      brakes:{bias:54,frontDuct:3,rearDuct:3},
      tires:{compound:'Soft'},
      power:{rpm:16400,radiator:45,ratio1:17,ratio2:25,ratio3:31,ratio4:35,ratio5:39,ratio6:43},

    const descriptions={
      packers:['Packers / topes de suspensión','Limitan la carrera disponible antes de que el conjunto llegue al tope.','Un contacto prematuro con el tope puede provocar pérdidas repentinas de agarre sobre pianos o baches.'],
      fastBump:['Compresión rápida','Resistencia del amortiguador cuando la rueda se comprime rápidamente, por ejemplo, al pasar sobre un piano.','Más rigidez puede controlar impactos grandes, pero también dificultar que la rueda siga las irregularidades.'],

      slowBump:['Compresión lenta','Control del amortiguador durante movimientos lentos de la carrocería, como balanceo y cabeceo.','Más compresión lenta puede reducir movimientos transitorios, a costa de alterar la transferencia dinámica de carga.'],
      slowRebound:['Extensión lenta','Control de la extensión del amortiguador durante transferencias de peso suaves.','Ayuda a modular el balance transitorio; demasiado valor puede dejar la suspensión comprimida entre eventos.'],

      rideHeight:['Altura al suelo','Separación estática del chasis respecto de la pista en el eje seleccionado.','Una altura baja puede mejorar la plataforma aerodinámica, pero aumenta riesgo de tocar el suelo o llegar a topes.'],
      front:['Barra estabilizadora delantera','Resistencia del eje delantero al balanceo diferencial entre ruedas.','Aumentarla suele desplazar el reparto de transferencia lateral hacia delante, favoreciendo el subviraje en condiciones comparables.'],
      rear:['Barra estabilizadora trasera','Resistencia del eje trasero al balanceo diferencial entre ruedas.','Aumentarla suele desplazar transferencia lateral hacia atrás, pudiendo favorecer la rotación y el sobreviraje.'],
      frontWing:['Ala delantera','Nivel relativo de carga aerodinámica producida por el alerón delantero.','Más ala suele incrementar agarre delantero a velocidad, junto con la resistencia aerodinámica.'],
      rearWing:['Ala trasera','Nivel relativo de carga aerodinámica del alerón trasero.','Más ala puede mejorar estabilidad trasera en curvas rápidas, con penalización por drag.'],
      camber:['Caída / camber','Ángulo de inclinación de la rueda respecto de la vertical; negativo significa la parte superior inclinada hacia dentro.','Mayor caída negativa puede beneficiar curvas cargadas, pero reduce la huella en recta y afecta desgaste y temperatura.'],
      toe:['Convergencia / toe','Ángulo de orientación de la rueda respecto del eje longitudinal; el signo depende de la convención de cada simulador.','Puede estabilizar o agilizar la respuesta inicial, pero valores altos elevan la resistencia y temperatura.'],
      pressure:['Presión del neumático','Presión de inflado de la cubierta, expresada aquí en psi.','Cambia la rigidez, respuesta, temperatura y huella del neumático; no existe una presión óptima universal.'],
      bias:['Reparto de frenada','Porcentaje de fuerza de frenado solicitado al eje delantero.','Más porcentaje delantero suele dar estabilidad, pero puede bloquear primero las ruedas delanteras.'],
      frontDuct:['Conducto delantero de frenos','Apertura relativa de ventilación de los discos delanteros.','Más ventilación reduce temperatura, pero aumenta la resistencia y puede impedir llegar a la temperatura operativa.'],
      rearDuct:['Conducto trasero de frenos','Apertura relativa de ventilación de los discos traseros.','Más ventilación protege frente a sobrecalentamiento y puede enfriar demasiado en trayectos de baja exigencia.'],
      radiator:['Apertura de radiador','Porcentaje de apertura de refrigeración.','Una apertura mayor puede reducir temperaturas del motor a costa de más resistencia aerodinámica.'],
      rpm:['Límite de revoluciones','Régimen máximo permitido antes del limitador de encendido.','Un límite superior puede ampliar el rango útil, pero en un motor real podría comprometer durabilidad.'],
      fuel:['Combustible','Litros de combustible cargados para la salida.','Más combustible aumenta autonomía y masa inicial; el efecto exacto depende de densidad y consumo.'],
      ratio:['Relación de transmisión','Ajuste numérico simplificado de una de las seis marchas; esta demo no fija una convención física de dientes.','Relaciones más cortas pueden mejorar aceleración y exigir más cambios; las largas ayudan a velocidad punta según el motor.']
    };
    const spec={
      packers:{label:'Packers',min:0,max:20,step:1,unit:'mm',advanced:true},
      fastBump:{label:'Fast bump',min:0,max:15,step:1,advanced:true},
      fastRebound:{label:'Fast rebound',min:0,max:20,step:1,advanced:true},
      slowBump:{label:'Slow bump',min:0,max:20,step:1},

      front:{label:'Front',min:0,max:6000,step:100,unit:' lb/in'},
      rear:{label:'Rear',min:0,max:6000,step:100,unit:' lb/in'},
      frontWing:{label:'Front wing',min:0,max:25,step:1},
      rearWing:{label:'Rear wing',min:0,max:25,step:1},
      pressure:{label:'Pressure',min:18,max:32,step:0.5,unit:' psi'},
      camber:{label:'Camber',min:-8,max:1,step:0.1,unit:'°'},
      toe:{label:'Toe',min:-2,max:2,step:0.1,unit:'°'},
      bias:{label:'Front bias',min:45,max:65,step:1,unit:'%'},
      frontDuct:{label:'Front ducts',min:0,max:6,step:1},

      rpm:{label:'Max RPM',min:15000,max:17500,step:100,unit:' rpm'},

    let data=deepCopy(defaults),saved=deepCopy(defaults),current='aeroWheels',quick=false,symmetry=true,lastHelp='spring',changed=false;
    const mergeDefaults=(def,raw)=>{

    const get=(path,obj=data)=>path.split('.').reduce((v,k)=>v?.[k],obj);

    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const getCenterAdjust=()=>{
      if(current==='suspension')return `<div class="center-label">BARRAS ESTABILIZADORAS</div>${param('antiRoll.front','front','Delantera')}${param('antiRoll.rear','rear','Trasera')}`;
      if(current==='aeroWheels')return `<div class="center-label">AERODINÁMICA</div>${param('aero.frontWing','frontWing','Ala delantera')}${param('aero.rearWing','rearWing','Ala trasera')}<div class="center-label with-gap">FRENADA</div>${param('brakes.bias','bias','Balance delantero')}<div class="middle-message" id="rear-bias">Trasero: ${100-data.brakes.bias}%</div>`;
      return `<div class="center-label">V10 · CAJA SECUENCIAL</div><div class="engine-metrics"><div><strong>${Number(data.power.rpm).toLocaleString('en-US')}</strong><span>RPM máximo</span></div><div><strong>6</strong><span>Marchas</span></div><div><strong>${data.power.radiator}%</strong><span>Radiador</span></div></div>`;
    };
    // Neumáticos: cuatro colores como máximo. Rain comparte azul acero con Hard y usa una línea discontinua.
    const COMPOUNDS={
      Soft:{color:'var(--yellow)',rate:3.15},
      Medium:{color:'var(--smoke)',rate:2.10},
      Hard:{color:'var(--steel)',rate:1.43},
      Rain:{color:'var(--steel)',rate:2.50}
    };
    const numFmt=(v,d=1)=>Number(v).toLocaleString('es-PE',{minimumFractionDigits:d,maximumFractionDigits:d});
    const bound=(x,min,max)=>Math.min(max,Math.max(min,x));
    const ps=()=>data.pitStrategy;
    const compoundButtons=(chosen,selector,extra='')=>`<div class="compound-toggles">${Object.entries(COMPOUNDS).map(([name,v])=>`<button type="button" class="tyre-type ${name===chosen?'is-selected':''}" ${selector}="${name}" ${extra} aria-pressed="${name===chosen}"><span class="tyre-dot" style="--tire-color:${v.color}"></span>${name}</button>`).join('')}</div>`;
    function tidyStops(){
      const p=ps();p.totalLaps=Math.round(bound(Number(p.totalLaps)||58,2,200));
      p.stops=Array.isArray(p.stops)?p.stops.slice(0,4):[];
      p.stops.forEach((stop,i)=>{
        stop.lap=Math.round(bound(Number(stop.lap)||Math.round(p.totalLaps*(i+1)/(p.stops.length+1)),1,p.totalLaps-1));
        stop.fuelAfter=bound(Number(stop.fuelAfter)||0,0,120);
        if(!COMPOUNDS[stop.compound])stop.compound='Medium';
      });
      p.stops.sort((a,b)=>a.lap-b.lap);
      // Unique service laps, preserving order when a user enters a duplicate.
      p.stops.forEach((stop,i)=>{stop.lap=Math.max(stop.lap,i? p.stops[i-1].lap+1:1);});
      for(let i=p.stops.length-1;i>=0;i--)p.stops[i].lap=Math.min(p.stops[i].lap,p.totalLaps-(p.stops.length-i));

    function calculateStrategy(){
      const p=ps(),laps=Number(p.totalLaps),consumption=Number(p.fuelPerLap),rate=Number(p.refuelRate),tyreSecs=Number(p.tireChangeTime);
      let fuel=Number(p.initialFuel),lastLap=0,compound=p.initialCompound,totalService=0,added=0,warnings=[];
      const stints=[];const services=[];
      for(let i=0;i<=p.stops.length;i++){
        const stop=p.stops[i],endLap=stop?stop.lap:laps,len=endLap-lastLap;
        const fuelEnd=fuel-len*consumption;
        const base=COMPOUNDS[compound]||COMPOUNDS.Soft;
        const wear=base.rate*len*(1+.0025*len);
        const stint={number:i+1,startLap:lastLap+1,endLap,laps:len,compound,wear,fuelStart:fuel,fuelEnd};
        stints.push(stint);
        if(fuelEnd<0)warnings.push(`Stint ${i+1}: déficit de ${numFmt(-fuelEnd)} L`);
        if(wear>100)warnings.push(`Stint ${i+1}: desgaste supera 100 %`);
        if(stop){
          const refueled=Math.max(0,Number(stop.fuelAfter)-Math.max(0,fuelEnd));
          const fuelOut=Math.min(120,Math.max(fuelEnd,Number(stop.fuelAfter)));
          if(Number(stop.fuelAfter)<fuelEnd)warnings.push(`Parada ${i+1}: combustible objetivo inferior al remanente`);
          const refillSec=refueled/Math.max(.1,rate),serviceSec=refillSec+tyreSecs;
          services.push({number:i+1,lap:stop.lap,fuelIn:fuelEnd,fuelOut,refueled,refillSec,tyreSec:tyreSecs,serviceSec,compound:stop.compound});
          totalService+=serviceSec;added+=refueled;fuel=fuelOut;compound=stop.compound;
        }
        lastLap=endLap;
      }
      return {stints,services,totalService,added,warnings,finalFuel:stints.at(-1)?.fuelEnd??0};
    }
    function stopCard(stop,index,computed){
      const service=computed.services[index];
      return `<article class="pit-stop-card"><div class="pit-stop-head"><span class="stop-index">PARADA ${String(index+1).padStart(2,'0')}</span><button class="pit-remove" data-remove-stop="${index}" title="Eliminar esta parada" aria-label="Eliminar parada ${index+1}">×</button></div>
        <div class="pit-fields"><label class="strategy-field"><span>Vuelta de entrada</span><div class="strategy-input-wrap"><input type="number" min="1" max="${ps().totalLaps-1}" step="1" data-stop-field="lap" data-stop-index="${index}" value="${stop.lap}"><span>V.</span></div></label>
        <label class="strategy-field"><span>Combustible tras parada</span><div class="strategy-input-wrap"><input type="number" min="0" max="120" step="1" data-stop-field="fuelAfter" data-stop-index="${index}" value="${stop.fuelAfter}"><span>L</span></div></label></div>
        <div class="pit-compound-label">NEUMÁTICO A MONTAR</div>${compoundButtons(stop.compound,'data-stop-compound',`data-stop-index="${index}"`)}
        <div class="pit-calc"><div><span>Combustible al llegar</span><b class="${service.fuelIn<0?'alert-text':''}">${numFmt(service.fuelIn)} L</b></div><div><span>Repostaje (${numFmt(service.refueled)} L)</span><b>${numFmt(service.refillSec)} s</b></div><div><span>Cambio de ruedas</span><b>${numFmt(service.tyreSec)} s</b></div><div class="pit-calc-total"><span>SERVICIO TOTAL</span><strong>${numFmt(service.serviceSec)} s</strong></div></div>
      </article>`;
    }
    function renderStrategy(){
      tidyStops();const p=ps(),calc=calculateStrategy();
      const stopsHtml=p.stops.map((stop,index)=>stopCard(stop,index,calc)).join('')||'<div class="no-stops">Sin paradas programadas. La carrera se realiza con el compuesto y combustible iniciales.</div>';
      return `<div class="strategy-board">
        <div class="strategy-top">
          <section class="panel strategy-config"><div class="panel-head"><span class="panel-title">PLAN DE CARRERA</span><span class="panel-tag">CONFIGURACIÓN INICIAL</span></div>
            <div class="strategy-config-grid">
              <label class="strategy-field"><span>Vueltas de carrera</span><div class="strategy-input-wrap"><input type="number" min="2" max="200" step="1" data-strategy-field="totalLaps" value="${p.totalLaps}"><span>V.</span></div></label>
              <label class="strategy-field"><span>Combustible inicial</span><div class="strategy-input-wrap"><input type="number" min="0" max="120" step="1" data-strategy-field="initialFuel" value="${p.initialFuel}"><span>L</span></div></label>
              <label class="strategy-field"><span>Número de paradas</span><select data-strategy-count aria-label="Número de paradas">${[0,1,2,3,4].map(v=>`<option value="${v}" ${v===p.stops.length?'selected':''}>${v}</option>`).join('')}</select></label>
              <label class="strategy-field"><span>Consumo estimado</span><div class="strategy-input-wrap"><input type="number" min="0.1" max="10" step="0.1" data-strategy-field="fuelPerLap" value="${p.fuelPerLap}"><span>L/vuelta</span></div></label>
            </div><div class="pit-compound-label">COMPUESTO DE SALIDA</div>${compoundButtons(p.initialCompound,'data-initial-compound')}
          </section>
          <section class="panel strategy-service"><div class="panel-head"><span class="panel-title">TIEMPO EN BOXES</span><span class="panel-tag">REPOSTAJE + RUEDAS</span></div>
            <div class="service-inputs">
              <label class="strategy-field"><span>Caudal de repostaje</span><div class="strategy-input-wrap"><input type="number" min="1" max="20" step="0.5" data-strategy-field="refuelRate" value="${p.refuelRate}"><span>L/s</span></div></label>
              <label class="strategy-field"><span>Cambio de 4 ruedas</span><div class="strategy-input-wrap"><input type="number" min="1" max="30" step="0.1" data-strategy-field="tireChangeTime" value="${p.tireChangeTime}"><span>s</span></div></label>
            </div><div class="pit-total"><span>TIEMPO TOTAL DE SERVICIO</span><strong>${numFmt(calc.totalService)} <small>s</small></strong></div>
            <div class="pit-service-stats"><div><span>Combustible añadido</span><b>${numFmt(calc.added)} L</b></div><div><span>Combustible en meta</span><b class="${calc.finalFuel<0?'alert-text':''}">${numFmt(calc.finalFuel)} L</b></div></div>
            <div class="service-footnote">Estimación secuencial. No incluye entrada ni salida del pitlane.</div>
          </section>
        </div>
        <section class="strategy-stops-section"><div class="strategy-section-head"><h2>PARADAS PROGRAMADAS</h2><button class="action pit-add" id="add-stop" ${p.stops.length>=4?'disabled':''}>+ Añadir parada</button></div><div class="pit-stops-grid">${stopsHtml}</div></section>
        <section class="panel wear-panel"><div class="strategy-section-head"><div><h2>CURVAS DE DESGASTE</h2><div class="wear-caption">DESGASTE ESTIMADO DE NEUMÁTICOS · % POR STINT</div></div><div class="wear-legend">${Object.entries(COMPOUNDS).map(([key,v])=>`<span><i style="background:${v.color}"></i>${key}</span>`).join('')}</div></div>
          <div class="chart-shell"><canvas id="wear-chart" role="img" aria-label="Curvas de desgaste estimado por stint durante ${p.totalLaps} vueltas"></canvas></div>
          <div class="stint-grid">${calc.stints.map(stint=>`<article class="stint-chip"><div class="stint-label"><span>STINT ${String(stint.number).padStart(2,'0')}</span><span class="stint-compound"><i style="background:${COMPOUNDS[stint.compound].color}"></i>${stint.compound}</span></div><strong>V. ${stint.startLap}—${stint.endLap}</strong><div><span>Desgaste</span><b class="${stint.wear>=95?'alert-text':''}">${numFmt(stint.wear,0)}%</b></div><div><span>Fuel remanente</span><b class="${stint.fuelEnd<0?'alert-text':''}">${numFmt(stint.fuelEnd)} L</b></div></article>`).join('')}</div>
          ${calc.warnings.length?`<div class="strategy-warning">${calc.warnings.map(esc).join(' · ')}</div>`:''}
          <p class="strategy-disclaimer">Las curvas son orientativas; el desgaste se calcula a partir de tasas ilustrativas por compuesto, no de la telemetría del simulador.</p>
        </section>
      </div>`;
    }
    function drawWearChart(){
      const canvas=document.querySelector('#wear-chart');if(!canvas)return;
      const p=ps(),calc=calculateStrategy(),r=canvas.getBoundingClientRect(),w=Math.max(320,r.width),h=Math.max(180,r.height);
      const scale=window.devicePixelRatio||1;canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
      const ctx=canvas.getContext('2d');ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,w,h);
      const computed=getComputedStyle(document.documentElement);
      const ink={
        smoke:computed.getPropertyValue('--smoke').trim(),
        steel:computed.getPropertyValue('--steel').trim(),
        yellow:computed.getPropertyValue('--yellow').trim()
      };
      const left=43,right=16,top=13,bottom=30,cw=w-left-right,ch=h-top-bottom;
      const x=lap=>left+lap/p.totalLaps*cw,y=wear=>top+ch*(1-Math.min(100,Math.max(0,wear))/100);
      ctx.lineWidth=1;ctx.font='12px Rajdhani, sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
      for(let v=0;v<=100;v+=25){
        const py=y(v);
        ctx.globalAlpha=.3;ctx.strokeStyle=ink.steel;ctx.beginPath();ctx.moveTo(left,py);ctx.lineTo(w-right,py);ctx.stroke();
        ctx.globalAlpha=.8;ctx.fillStyle=ink.smoke;ctx.fillText(`${v}%`,left-7,py);
      }
      ctx.globalAlpha=.78;ctx.fillStyle=ink.smoke;ctx.textAlign='center';ctx.textBaseline='top';
      for(let i=0;i<=5;i++){const lap=Math.round(i*p.totalLaps/5);ctx.fillText(String(lap),x(lap),h-bottom+8);}
      ctx.lineWidth=1;ctx.globalAlpha=.7;ctx.strokeStyle=ink.steel;ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,h-bottom);ctx.lineTo(w-right,h-bottom);ctx.stroke();
      for(const stop of p.stops){
        const px=x(stop.lap);ctx.globalAlpha=.4;ctx.setLineDash([4,5]);ctx.strokeStyle=ink.smoke;
        ctx.beginPath();ctx.moveTo(px,top);ctx.lineTo(px,h-bottom);ctx.stroke();ctx.setLineDash([]);
      }
      ctx.globalAlpha=1;
      for(const stint of calc.stints){const info=COMPOUNDS[stint.compound],start=stint.startLap-1,finish=stint.endLap,rate=info.rate;
        ctx.strokeStyle=stint.compound==='Soft'?ink.yellow:stint.compound==='Medium'?ink.smoke:ink.steel;
        ctx.setLineDash(stint.compound==='Rain'?[7,4]:[]);ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
        for(let i=0;i<=Math.max(20,stint.laps*5);i++){let z=i/Math.max(20,stint.laps*5),lap=start+z*stint.laps,wear=rate*(z*stint.laps)*(1+.0025*z*stint.laps);i===0?ctx.moveTo(x(lap),y(wear)):ctx.lineTo(x(lap),y(wear));}
        ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(x(finish),y(stint.wear),3.4,0,Math.PI*2);ctx.fill();
      }
    }
    function addStop(){
      const p=ps();if(p.stops.length>=4||p.totalLaps<=p.stops.length+1)return;
      let lap=Math.round(p.totalLaps*(p.stops.length+1)/(p.stops.length+2));
      while(p.stops.some(s=>s.lap===lap)&&lap<p.totalLaps-1)lap++;

    }
    function updateStopCount(count){
      count=bound(Math.round(count),0,4);

      tidyStops();changed=true;render();
    }
    function addStopSilent(){

    }
    function render(){

    function mirror(path){

    function updateDisplayed(path,key){

    const toastEl=document.querySelector('#toast');let toastTimer;

      if(current==='suspension'){data.suspension=deepCopy(defaults.suspension);data.antiRoll=deepCopy(defaults.antiRoll);}
      if(current==='aeroWheels'){data.aero=deepCopy(defaults.aero);data.wheels=deepCopy(defaults.wheels);data.brakes=deepCopy(defaults.brakes);}
      if(current==='power')data.power=deepCopy(defaults.power);
      if(current==='strategy'){data.pitStrategy=deepCopy(defaults.pitStrategy);data.tires.compound=data.pitStrategy.initialCompound;}
      changed=true;render();showToast('Valores de esta pestaña restaurados');
    });
    // Browser design reference only. The native game persists these actions in SQLite.
    let demoReglajes=[],selectedReglaje=-1;
    try {const rows=JSON.parse(localStorage.getItem('open-formula-garage-reglajes-demo-v1')||'[]');if(Array.isArray(rows))demoReglajes=rows;}catch(e){}
    function persistReglajes(){try{localStorage.setItem('open-formula-garage-reglajes-demo-v1',JSON.stringify(demoReglajes));}catch(e){showToast('No se pudo guardar el reglaje');}}
    function renderReglajes(){
      const body=document.querySelector('#reglajes-list');body.replaceChildren();
      demoReglajes.forEach((r,i)=>{const row=document.createElement('tr');row.style.cursor='pointer';if(i===selectedReglaje)row.style.background='var(--steel)';
        [r.name,'Williams',new Date(r.modified).toLocaleString('es-CO')].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;cell.style.padding='12px';row.append(cell);});
        row.addEventListener('click',()=>{selectedReglaje=i;renderReglajes();});body.append(row);
      });
    }
    document.querySelector('#create-reglaje').addEventListener('click',()=>{
      const name=prompt('Nombre del reglaje','Reglaje '+(demoReglajes.length+1));if(!name?.trim())return;
      const now=new Date().toISOString();demoReglajes.push({name:name.trim(),created:now,modified:now,values:deepCopy(data)});selectedReglaje=demoReglajes.length-1;persistReglajes();renderReglajes();showToast('Reglaje creado');
    });
    document.querySelector('#save').addEventListener('click',()=>{
      if(selectedReglaje<0){showToast('Selecciona un reglaje');return;}
      demoReglajes[selectedReglaje].values=deepCopy(data);demoReglajes[selectedReglaje].modified=new Date().toISOString();saved=deepCopy(data);changed=false;persistReglajes();render();showToast('Reglaje guardado');
    });
    document.querySelector('#load-reglaje').addEventListener('click',()=>{
      if(selectedReglaje<0){showToast('Selecciona un reglaje');return;}
      data=deepCopy(demoReglajes[selectedReglaje].values);changed=true;render();showToast('Reglaje cargado en el editor');
    });
    document.querySelector('#delete-reglaje').addEventListener('click',()=>{
      if(selectedReglaje<0||!confirm('¿Eliminar el reglaje seleccionado?'))return;
      demoReglajes.splice(selectedReglaje,1);selectedReglaje=-1;persistReglajes();renderReglajes();showToast('Reglaje eliminado');
    });
    document.querySelector('#exit').addEventListener('click',()=>{if(window.history.length>1)window.history.back();else showToast('No hay una página anterior a la que volver');});
    render();
  </script>
</body>
</html>
